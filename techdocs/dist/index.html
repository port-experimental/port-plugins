(()=>{"use strict";var e={529(e,t,n){n.d(t,{A:()=>l});var r=n(601),o=n.n(r),i=n(314),a=n.n(i)()(o());a.push([e.id,'/* \u2500\u2500 Theme: inherit from Port host, with local polish \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n:root {\n  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,\n    Ubuntu, sans-serif;\n  font-size: 14px;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n\n  --bg: var(--background-primary, #eef1f6);\n  --card: var(--background-dim, #ffffff);\n  --card2: var(--background-dim-transparent, #f4f6f9);\n  --border: var(--border-medium, rgba(15, 23, 42, 0.08));\n  --text: var(--text-high, #0f172a);\n  --muted: var(--text-medium, #64748b);\n  --blue: #2563eb;\n  --blue-hover: #1d4ed8;\n  --accent-soft: color-mix(in srgb, var(--blue) 12%, transparent);\n  --radius: 10px;\n  --radius-sm: 6px;\n  --radius-lg: 16px;\n  --radius-xl: 20px;\n\n  --doc-prose: color-mix(in srgb, var(--text) 90%, var(--muted));\n  --doc-prose-heading: var(--text);\n  --doc-accent-line: linear-gradient(90deg,\n      var(--blue),\n      color-mix(in srgb, var(--blue) 40%, transparent));\n\n  --hover-bg: var(--background-dim-transparent, rgba(15, 23, 42, 0.04));\n  --hover-bg-md: var(--background-dim-transparent, rgba(15, 23, 42, 0.07));\n  --border-hover: var(--border-contrast-medium, rgba(15, 23, 42, 0.18));\n  --badge-bg: var(--background-dim-transparent, rgba(15, 23, 42, 0.06));\n  --shadow-dropdown: 0 12px 40px rgba(15, 23, 42, 0.12);\n  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);\n  --shadow-md: 0 4px 20px rgba(15, 23, 42, 0.07);\n  --shadow-card: 0 0 0 1px color-mix(in srgb, var(--border) 80%, transparent),\n    0 2px 4px rgba(15, 23, 42, 0.04), 0 16px 40px rgba(15, 23, 42, 0.08);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);\n\n  --sidebar-width: 272px;\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml,\nbody,\n#plugin-root {\n  height: 100%;\n  min-height: 100%;\n}\n\nbody {\n  background: #eef1f6;\n  background: var(--bg);\n  color: #0f172a;\n  color: var(--text);\n  background-image: radial-gradient(ellipse 120% 80% at 50% -20%,\n      rgba(37, 99, 235, 0.08),\n      transparent 55%);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\nbody {\n  background-image: radial-gradient(ellipse 120% 80% at 50% -20%,\n      color-mix(in srgb, var(--blue) 8%, transparent),\n      transparent 55%);\n}\n}\n\n/* \u2500\u2500 Loading / empty states \u2500\u2500 */\n\n.shell {\n  padding: 16px;\n  min-height: 100%;\n  overflow-y: auto;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.muted {\n  color: #64748b;\n  color: var(--muted);\n  font-style: italic;\n  text-align: center;\n  padding: 32px 0;\n}\n\n/* \u2500\u2500 Full-page docs loading / error (before layout mounts) \u2500\u2500 */\n\n.docs-fetch-state {\n  min-height: 100%;\n  height: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 28px 20px;\n  box-sizing: border-box;\n}\n\n.docs-fetch-card {\n  width: 100%;\n  max-width: 440px;\n  text-align: center;\n  padding: 36px 32px 32px;\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(15, 23, 42, 0.08);\n  border: 1px solid var(--border);\n  border-radius: 16px;\n  border-radius: var(--radius-lg);\n  box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.064),\n    0 2px 4px rgba(15, 23, 42, 0.04), 0 16px 40px rgba(15, 23, 42, 0.08);\n  box-shadow: var(--shadow-card);\n}\n\n.docs-fetch-state--loading .docs-fetch-card {\n  padding-top: 40px;\n}\n\n.docs-fetch-spinner-svg {\n  display: block;\n  margin: 0 auto 22px;\n  flex-shrink: 0;\n}\n\n.docs-fetch-spinner-track {\n  stroke: rgba(100, 116, 139, 0.38);\n}\n\n.docs-fetch-spinner-head {\n  stroke: #2563eb;\n  stroke: var(--blue, #2563eb);\n}\n\n.docs-fetch-title {\n  font-size: 1.15rem;\n  font-weight: 700;\n  color: #0f172a;\n  color: var(--text);\n  letter-spacing: -0.02em;\n  line-height: 1.3;\n  margin: 0 0 10px;\n}\n\n.docs-fetch-subtitle {\n  font-size: 14px;\n  line-height: 1.55;\n  color: #64748b;\n  color: var(--muted);\n  margin: 0;\n}\n\n.docs-fetch-card--error {\n  text-align: left;\n  border-color: rgba(190, 58, 62, 0.282);\n  box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.064),\n    0 2px 4px rgba(15, 23, 42, 0.04), 0 16px 40px rgba(15, 23, 42, 0.08),\n    0 0 0 1px rgba(239, 68, 68, 0.12);\n  box-shadow: var(--shadow-card),\n    0 0 0 1px rgba(239, 68, 68, 0.12);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.docs-fetch-card--error {\n  border-color: color-mix(in srgb, #ef4444 22%, var(--border));\n}\n}\n\n.docs-fetch-error-icon-wrap {\n  display: flex;\n  justify-content: center;\n  margin-bottom: 18px;\n}\n\n.docs-fetch-error-icon {\n  width: 44px;\n  height: 44px;\n  color: #ef4444;\n  flex-shrink: 0;\n}\n\n.docs-fetch-state--error .docs-fetch-title {\n  text-align: center;\n}\n\n.docs-fetch-state--error .docs-fetch-subtitle {\n  text-align: center;\n}\n\n.docs-fetch-error-detail {\n  margin-top: 20px;\n  padding: 14px 16px;\n  background: #f4f6f9;\n  background: var(--card2);\n  border: 1px solid rgba(15, 23, 42, 0.08);\n  border: 1px solid var(--border);\n  border-radius: 10px;\n  border-radius: var(--radius);\n  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,\n    monospace;\n  font-size: 12px;\n  line-height: 1.5;\n  color: #0f172a;\n  color: var(--text);\n  white-space: pre-wrap;\n  word-break: break-word;\n  overflow: auto;\n  max-height: min(280px, 40vh);\n  scrollbar-gutter: stable;\n}\n\n@media (max-width: 480px) {\n  .docs-fetch-card {\n    padding: 28px 22px 24px;\n  }\n\n  .docs-fetch-title {\n    font-size: 1.05rem;\n  }\n}\n\n/* \u2500\u2500 Main layout \u2500\u2500 */\n\n.layout {\n  display: flex;\n  height: 100%;\n  overflow: hidden;\n  gap: 0;\n}\n\n.layout-sidebar-column {\n  flex-shrink: 0;\n  height: 100%;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n\n.layout-sidebar-column .sidebar {\n  width: 100% !important;\n  min-width: 0 !important;\n  flex: 1;\n  min-height: 0;\n}\n\n.column-resize-handle {\n  flex-shrink: 0;\n  width: 6px;\n  cursor: col-resize;\n  touch-action: none;\n  background: transparent;\n  position: relative;\n  z-index: 6;\n  align-self: stretch;\n}\n\n.column-resize-handle:hover {\n  background: rgba(37, 99, 235, 0.14);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.column-resize-handle:hover {\n  background: color-mix(in srgb, var(--blue) 14%, transparent);\n}\n}\n\n.column-resize-handle::after {\n  content: "";\n  position: absolute;\n  left: 50%;\n  top: 0;\n  bottom: 0;\n  width: 1px;\n  transform: translateX(-50%);\n  background: rgba(15, 23, 42, 0.08);\n  background: var(--border);\n}\n\n@media (max-width: 768px) {\n  .layout {\n    flex-direction: column;\n    height: 100%;\n    min-height: 0;\n    overflow: hidden;\n    -webkit-overflow-scrolling: touch;\n  }\n\n  .layout-sidebar-mobile {\n    flex-shrink: 0;\n    position: relative;\n    z-index: 30;\n  }\n\n  .sidebar-mobile-reveal {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n    width: 100%;\n    padding: 14px 16px;\n    border: none;\n    border-bottom: 1px solid rgba(15, 23, 42, 0.08);\n    border-bottom: 1px solid var(--border);\n    background: #ffffff;\n    background: var(--card);\n    color: #0f172a;\n    color: var(--text);\n    font: inherit;\n    font-weight: 650;\n    font-size: 13px;\n    cursor: pointer;\n    text-align: left;\n    transition: background 0.15s ease, color 0.15s ease;\n    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);\n    box-shadow: var(--shadow-sm);\n  }\n\n  .sidebar-mobile-reveal:hover {\n    background: rgba(15, 23, 42, 0.07);\n    background: var(--hover-bg-md);\n  }\n\n  .sidebar-mobile-reveal:focus-visible {\n    outline: 2px solid #2563eb;\n    outline: 2px solid var(--blue);\n    outline-offset: -2px;\n  }\n\n  .sidebar-mobile-reveal-label {\n    letter-spacing: 0.02em;\n  }\n\n  .sidebar-mobile-reveal-icon {\n    flex-shrink: 0;\n    font-size: 18px;\n    line-height: 1;\n    color: #2563eb;\n    color: var(--blue);\n  }\n\n  .sidebar-mobile-backdrop {\n    position: fixed;\n    top: 0;\n    right: 0;\n    bottom: 0;\n    left: 0;\n    z-index: 28;\n    background: rgba(15, 23, 42, 0.38);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.22s ease, visibility 0.22s;\n    pointer-events: none;\n  }\n\n  .layout-sidebar-mobile.is-open .sidebar-mobile-backdrop {\n    opacity: 1;\n    visibility: visible;\n    pointer-events: auto;\n  }\n\n  .sidebar-mobile-panel {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    z-index: 29;\n    width: min(320px, 88vw);\n    max-width: 100%;\n    display: flex;\n    flex-direction: column;\n    background: #ffffff;\n    background: var(--card);\n    box-shadow: 8px 0 40px rgba(15, 23, 42, 0.18);\n    transform: translateX(-100%);\n    transition: transform 0.22s ease;\n    pointer-events: none;\n    min-height: 0;\n  }\n\n  .layout-sidebar-mobile.is-open .sidebar-mobile-panel {\n    transform: translateX(0);\n    pointer-events: auto;\n  }\n\n  .sidebar-mobile-toolbar {\n    flex-shrink: 0;\n    display: flex;\n    align-items: center;\n    justify-content: flex-end;\n    padding: 10px 10px 8px;\n    border-bottom: 1px solid rgba(15, 23, 42, 0.08);\n    border-bottom: 1px solid var(--border);\n    background: #ffffff;\n    background: var(--card);\n  }\n\n  .sidebar-mobile-close {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 36px;\n    height: 36px;\n    padding: 0;\n    border: none;\n    border-radius: 6px;\n    border-radius: var(--radius-sm);\n    background: transparent;\n    color: #64748b;\n    color: var(--muted);\n    font: inherit;\n    font-size: 16px;\n    line-height: 1;\n    cursor: pointer;\n    transition: background 0.15s ease, color 0.15s ease;\n  }\n\n  .sidebar-mobile-close:hover {\n    background: rgba(15, 23, 42, 0.07);\n    background: var(--hover-bg-md);\n    color: #0f172a;\n    color: var(--text);\n  }\n\n  .sidebar-mobile-close:focus-visible {\n    outline: 2px solid #2563eb;\n    outline: 2px solid var(--blue);\n    outline-offset: -2px;\n  }\n\n  .layout-sidebar-mobile .sidebar {\n    width: 100%;\n    min-width: 0;\n    flex: 1;\n    min-height: 0;\n    max-height: none;\n    border-right: none;\n    border-bottom: none;\n    box-shadow: none;\n  }\n\n  .doc-viewer {\n    flex: 1;\n    min-height: 0;\n  }\n\n  .column-resize-handle {\n    display: none !important;\n  }\n}\n\n/* \u2500\u2500 Sidebar \u2500\u2500 */\n\n.sidebar {\n  width: 272px;\n  width: var(--sidebar-width);\n  min-width: 272px;\n  min-width: var(--sidebar-width);\n  background: #ffffff;\n  background: var(--card);\n  border-right: 1px solid rgba(15, 23, 42, 0.08);\n  border-right: 1px solid var(--border);\n  box-shadow: 4px 0 24px rgba(15, 23, 42, 0.04);\n  display: flex;\n  flex-direction: column;\n  overflow-y: auto;\n  scrollbar-gutter: stable;\n}\n\n.sidebar-header {\n  padding: 18px 18px 14px;\n  font-weight: 700;\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: #64748b;\n  color: var(--muted);\n  border-bottom: 1px solid rgba(15, 23, 42, 0.08);\n  border-bottom: 1px solid var(--border);\n  background: linear-gradient(180deg,\n      rgb(255, 255, 255) 0%,\n      #ffffff 100%);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.sidebar-header {\n  background: linear-gradient(180deg,\n      color-mix(in srgb, var(--card) 100%, transparent) 0%,\n      var(--card) 100%);\n}\n}\n\n.sidebar-empty {\n  padding: 24px 16px;\n  color: #64748b;\n  color: var(--muted);\n  font-style: italic;\n  font-size: 12px;\n}\n\n.sidebar-loading-more {\n  flex-shrink: 0;\n  padding: 10px 16px 16px;\n  font-size: 11px;\n  color: #64748b;\n  color: var(--muted);\n  text-align: center;\n  border-top: 1px solid rgba(15, 23, 42, 0.08);\n  border-top: 1px solid var(--border);\n  background: #f4f6f9;\n  background: var(--card2);\n}\n\n/* \u2500\u2500 Tree \u2500\u2500 */\n\n.tree-list {\n  list-style: none;\n}\n\n.tree-root {\n  padding: 10px 12px 20px;\n}\n\n.tree-repo {\n  margin-bottom: 8px;\n}\n\n.tree-repo-label {\n  padding: 10px 10px 6px;\n  font-weight: 700;\n  font-size: 10px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: #64748b;\n  color: var(--muted);\n}\n\n.tree-item {\n  list-style: none;\n}\n\n.tree-button {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  width: 100%;\n  padding: 7px 10px;\n  border: none;\n  background: none;\n  color: #0f172a;\n  color: var(--text);\n  font: inherit;\n  font-size: 13px;\n  cursor: pointer;\n  text-align: left;\n  border-radius: 6px;\n  border-radius: var(--radius-sm);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  transition: background 0.14s ease, color 0.14s ease, box-shadow 0.14s ease;\n}\n\n.tree-button:hover {\n  background: rgba(15, 23, 42, 0.07);\n  background: var(--hover-bg-md);\n}\n\n.tree-doc.tree-active {\n  background: linear-gradient(90deg,\n      rgba(37, 99, 235, 0.12) 0%,\n      rgba(37, 99, 235, 0.042) 100%);\n  color: #2563eb;\n  color: var(--blue);\n  font-weight: 600;\n  box-shadow: inset 3px 0 0 #2563eb;\n  box-shadow: inset 3px 0 0 var(--blue);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.tree-doc.tree-active {\n  background: linear-gradient(90deg,\n      var(--accent-soft) 0%,\n      color-mix(in srgb, var(--accent-soft) 35%, transparent) 100%);\n}\n}\n\n.tree-chevron {\n  display: inline-block;\n  font-size: 8px;\n  transition: transform 0.15s;\n  flex-shrink: 0;\n  color: #64748b;\n  color: var(--muted);\n}\n\n.tree-chevron.expanded {\n  transform: rotate(90deg);\n}\n\n.tree-folder .tree-label {\n  color: #64748b;\n  color: var(--muted);\n}\n\n/* \u2500\u2500 Doc Viewer \u2500\u2500 */\n\n.doc-viewer {\n  flex: 1;\n  min-width: 0;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  background: transparent;\n}\n\n.doc-body {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: row;\n  overflow: hidden;\n}\n\n@media (max-width: 768px) {\n  .doc-body {\n    flex-direction: column;\n    min-height: 0;\n    flex: 1;\n  }\n\n  .doc-main {\n    flex: 1 1 0%;\n    min-height: 0;\n    overflow: hidden;\n  }\n}\n\n.doc-main {\n  flex: 1;\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n\n.doc-content-surface {\n  flex: 1;\n  min-width: 0;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  overflow-y: auto;\n  padding: 0;\n  background: #ffffff;\n  background: var(--card);\n  border-right: 1px solid rgba(15, 23, 42, 0.08);\n  border-right: 1px solid var(--border);\n  scrollbar-gutter: stable;\n}\n\n@media (max-width: 768px) {\n  .doc-content-surface {\n    border-right: none;\n  }\n}\n\n.doc-empty {\n  align-items: center;\n  justify-content: center;\n  padding: 32px;\n  background: transparent;\n}\n\n.doc-empty-card {\n  max-width: 360px;\n  text-align: center;\n  padding: 32px 28px;\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(15, 23, 42, 0.08);\n  border: 1px solid var(--border);\n  border-radius: 16px;\n  border-radius: var(--radius-lg);\n  box-shadow: 0 4px 20px rgba(15, 23, 42, 0.07);\n  box-shadow: var(--shadow-md);\n}\n\n.doc-empty-title {\n  font-size: 1.1rem;\n  font-weight: 700;\n  color: #0f172a;\n  color: var(--text);\n  margin: 0 0 8px;\n  letter-spacing: -0.02em;\n}\n\n.doc-empty-sub {\n  font-size: 14px;\n  line-height: 1.55;\n  color: #64748b;\n  color: var(--muted);\n  margin: 0;\n}\n\n.doc-header {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  flex-wrap: wrap;\n  gap: 16px 20px;\n  padding: 20px 20px 18px;\n  position: sticky;\n  top: 0;\n  z-index: 3
