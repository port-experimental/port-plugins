(()=>{"use strict";var e={529(e,t,n){n.d(t,{A:()=>o});var r=n(601),a=n.n(r),l=n(314),i=n.n(l)()(a());i.push([e.id,'/* \u2500\u2500 Theme: inherit from Port host via CSS variables injected by plugins-sdk \u2500\u2500 */\n:root {\n  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto,\n    Oxygen, Ubuntu, sans-serif;\n  font-size: 13px;\n\n  --bg: var(--background-primary, #f0f2f5);\n  --card: var(--background-dim, #ffffff);\n  --card2: var(--background-dim-transparent, #f7f8fa);\n  --border: var(--border-medium, rgba(0, 0, 0, 0.09));\n  --text: var(--text-high, #111827);\n  --muted: var(--text-medium, #6b7280);\n  --blue: #2563eb;\n  --radius: 8px;\n\n  --hover-bg: var(--background-dim-transparent, rgba(0, 0, 0, 0.04));\n  --hover-bg-md: var(--background-dim-transparent, rgba(0, 0, 0, 0.06));\n  --border-hover: var(--border-contrast-medium, rgba(0, 0, 0, 0.22));\n  --badge-bg: var(--background-dim-transparent, rgba(0, 0, 0, 0.06));\n  --shadow-dropdown: 0 8px 24px rgba(0, 0, 0, 0.12);\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml,\nbody,\n#plugin-root {\n  height: 100%;\n  min-height: 100%;\n}\n\nbody {\n  background: #f0f2f5;\n  background: var(--bg);\n  color: #111827;\n  color: var(--text);\n}\n\n.shell {\n  padding: 16px;\n  min-height: 100%;\n  overflow-y: auto;\n}\n\n.muted {\n  color: #6b7280;\n  color: var(--muted);\n  font-style: italic;\n  text-align: center;\n  padding: 32px 0;\n}\n',""]);const o=i},858(e,t,n){n.d(t,{A:()=>o});var r=n(601),a=n.n(r),l=n(314),i=n.n(l)()(a());i.push([e.id,'/*\n * DORA Metrics Dashboard\n * Uses Port CSS variables (injected by applyThemeCss) with light-mode fallbacks.\n * Dark mode is applied automatically when Port injects its dark-mode overrides.\n */\n\n.dora-dashboard {\n  /* \u2500\u2500 Token map \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  --dd-bg:          var(--background-primary,         #f7f9fa);\n  --dd-surface:     var(--background-dim,             #ffffff);\n  --dd-surface2:    var(--background-dim-transparent, #f3f6f7);\n  --dd-border:      var(--border-medium,              #e4e7e8);\n  --dd-text:        var(--text-high,                  #111111);\n  --dd-muted:       var(--text-medium,                #495762);\n  --dd-faint:       var(--text-low,                   #767e86);\n  --dd-accent:      #3860be;\n\n  /* Tier palette \u2014 Port-aligned */\n  --dd-elite:       #22c55e;\n  --dd-high:        #3860be;\n  --dd-medium:      #d97706;\n  --dd-low:         #dc2a2a;\n\n  /* Bucket colours (alias tier) */\n  --dd-daily:       var(--dd-elite);\n  --dd-weekly:      var(--dd-high);\n  --dd-monthly:     var(--dd-medium);\n  --dd-rare:        var(--dd-low);\n\n  /* \u2500\u2500 Layout \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n  padding: 24px;\n  background: #f7f9fa;\n  background: var(--dd-bg);\n  color: #111111;\n  color: var(--dd-text);\n  font-family: system-ui,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans, -apple-system, BlinkMacSystemFont, \'Segoe UI\', sans-serif;\n  font-size: 13px;\n  min-height: 100%;\n  box-sizing: border-box;\n}\n\n/* \u2500\u2500 Dark mode \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.dora-dashboard[data-theme="dark"] {\n  --dd-bg:      #0f1117;\n  --dd-surface: #13192b;\n  --dd-surface2: rgba(26, 35, 64, 0.6);\n  --dd-border:  #1e2a47;\n  --dd-text:    #e8edf5;\n  --dd-muted:   #6b87b8;\n  --dd-faint:   #4a5a78;\n  --dd-accent:  #3c73f3;\n  --dd-elite:   #4ade80;\n  --dd-high:    #3c73f3;\n  --dd-medium:  #fbbf24;\n  --dd-low:     #f87171;\n}\n\n/* \u2500\u2500 Loading / Error state \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.dora-dashboard__state {\n  padding: 60px 20px;\n  text-align: center;\n  color: var(--dd-muted);\n  font-style: italic;\n}\n.dora-dashboard__state--error {\n  color: var(--dd-low);\n  font-style: normal;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   FILTER BAR\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n.dora-filter-bar {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n\n.dora-filter-bar__search {\n  flex: 1;\n  min-width: 160px;\n  max-width: 280px;\n  padding: 7px 12px;\n  border-radius: 8px;\n  border: 1px solid var(--dd-border);\n  background: var(--dd-surface);\n  color: var(--dd-text);\n  font-size: 0.82rem;\n  outline: none;\n  transition: border-color 0.15s;\n}\n\n.dora-filter-bar__search::-moz-placeholder {\n  color: var(--dd-faint);\n}\n\n.dora-filter-bar__search::placeholder {\n  color: var(--dd-faint);\n}\n\n.dora-filter-bar__search:focus {\n  border-color: var(--dd-accent);\n}\n\n.dora-filter-bar__tiers {\n  display: flex;\n  gap: 6px;\n  flex-wrap: wrap;\n}\n\n.dora-filter-bar__tier {\n  padding: 5px 14px;\n  border-radius: 20px;\n  border: 1px solid var(--dd-border);\n  background: var(--dd-surface);\n  color: var(--dd-muted);\n  font-size: 0.75rem;\n  font-weight: 600;\n  cursor: pointer;\n  transition: background 0.12s, color 0.12s, border-color 0.12s;\n  font-family: inherit;\n}\n\n.dora-filter-bar__tier--Elite  { color: var(--dd-elite);  border-color: var(--dd-elite); }\n.dora-filter-bar__tier--High   { color: var(--dd-high);   border-color: var(--dd-high); }\n.dora-filter-bar__tier--Medium { color: var(--dd-medium); border-color: var(--dd-medium); }\n.dora-filter-bar__tier--Low    { color: var(--dd-low);    border-color: var(--dd-low); }\n\n.dora-filter-bar__tier--active                   { background: var(--dd-accent); border-color: var(--dd-accent); color: #fff; }\n.dora-filter-bar__tier--Elite.dora-filter-bar__tier--active  { background: var(--dd-elite);  border-color: var(--dd-elite);  color: #111; }\n.dora-filter-bar__tier--High.dora-filter-bar__tier--active   { background: var(--dd-high);   border-color: var(--dd-high);   color: #fff; }\n.dora-filter-bar__tier--Medium.dora-filter-bar__tier--active { background: var(--dd-medium); border-color: var(--dd-medium); color: #111; }\n.dora-filter-bar__tier--Low.dora-filter-bar__tier--active    { background: var(--dd-low);    border-color: var(--dd-low);    color: #fff; }\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   KPI CARDS ROW\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n.dora-kpi-row {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  grid-gap: 14px;\n  gap: 14px;\n}\n\n@media (max-width: 900px) {\n  .dora-kpi-row { grid-template-columns: repeat(2, 1fr); }\n}\n@media (max-width: 560px) {\n  .dora-kpi-row { grid-template-columns: 1fr; }\n}\n\n.dora-kpi-card {\n  background: var(--dd-surface);\n  border: 1px solid var(--dd-border);\n  border-radius: 10px;\n  padding: 20px 22px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  position: relative;\n  overflow: hidden;\n}\n\n/* No colored ::before top bar \u2014 removed */\n\n.dora-kpi-card__label {\n  font-size: 0.68rem;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  color: var(--dd-muted);\n  margin-bottom: 2px;\n}\n\n.dora-kpi-card__value {\n  font-size: 2.8rem;\n  font-weight: 700;\n  line-height: 1;\n  font-feature-settings: "tnum";\n  font-variant-numeric: tabular-nums;\n  color: var(--dd-text);\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n}\n\n.dora-kpi-card__value--unit {\n  font-size: 1.1rem;\n  font-weight: 400;\n  color: var(--dd-muted);\n}\n\n.dora-kpi-card__subtitle {\n  font-size: 0.75rem;\n  color: var(--dd-muted);\n  margin-top: 2px;\n  margin-bottom: 4px;\n}\n\n.dora-kpi-card__badges {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  margin-top: 4px;\n}\n\n.dora-badge {\n  display: inline-flex;\n  align-items: center;\n  padding: 2px 9px;\n  border-radius: 20px;\n  font-size: 0.68rem;\n  font-weight: 600;\n  white-space: nowrap;\n}\n.dora-badge--Elite  { background: rgba(34, 197, 94, 0.12);  color: var(--dd-elite); }\n.dora-badge--High   { background: rgba(56, 96, 190, 0.12);  color: var(--dd-high); }\n.dora-badge--Medium { background: rgba(217, 119, 6, 0.12);  color: var(--dd-medium); }\n.dora-badge--Low    { background: rgba(220, 42, 42, 0.12);  color: var(--dd-low); }\n.dora-badge--info   { background: rgba(136, 146, 176, 0.12); color: var(--dd-muted); }\n\n.dora-kpi-card__unconfigured {\n  color: var(--dd-faint);\n  font-size: 0.82rem;\n  font-style: italic;\n  padding: 8px 0;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   SECTION HEADINGS\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n.dora-section-title {\n  font-size: 0.7rem;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: var(--dd-muted);\n  margin: 0 0 14px 0;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2 col {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  grid-gap: 14px;\n  gap: 14px;\n}\n@media (max-width: 780px) {\n  .dora-two-col { grid-template-columns: 1fr; }\n}\n\n.dora-panel {\n  background: var(--dd-surface);\n  border: 1px solid var(--dd-border);\n  border-radius: 10px;\n  padding: 20px 22px;\n  display: flex;\n  flex-direction: column;\n}\n\n.dora-panel--unconfigured {\n  align-items: center;\n  justify-content: center;\n  min-height: 180px;\n  color: var(--dd-faint);\n  font-style: italic;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   BUCKET BAR CHART\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n.dora-bucket-chart {\n  display: flex;\n  flex-direction: column;\n}\n\n.dora-bucket-bars {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.dora-bucket-row {\n  display: grid;\n  grid-template-columns: 82px 1fr 38px 38px;\n  align-items: center;\n  grid-gap: 8px;\n  gap: 8px;\n}\n\n.dora-bucket-row__label {\n  font-size: 0.78rem;\n  color: var(--dd-muted);\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n.dora-bucket-row__track {\n  height: 10px;\n  background: var(--dd-border);\n  border-radius: 5px;\n  overflow: hidden;\n}\n\n.dora-bucket-row__fill {\n  height: 100%;\n  border-radius: 5
