(()=>{"use strict";var e={529(e,t,n){var r=n(601),a=n.n(r),i=n(314),o=n.n(i)()(a());o.push([e.id,'/* \u2500\u2500 Theme tokens (from Port host via applyThemeCss) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n:root {\n  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto,\n    Oxygen, Ubuntu, sans-serif;\n  font-size: 13px;\n\n  --bg: var(--background-primary, #f0f2f5);\n  --card: var(--background-dim, #ffffff);\n  --card2: var(--background-dim-transparent, #f7f8fa);\n  --border: var(--border-medium, rgba(0, 0, 0, 0.09));\n  --text: var(--text-high, #111827);\n  --muted: var(--text-medium, #6b7280);\n  --text-faint: var(--text-low, #9ca3af);\n  --radius: 8px;\n\n  --hover-bg: var(--background-dim-transparent, rgba(0, 0, 0, 0.04));\n  --primary: var(--accent-color, #5a4cff);\n\n  --error-bg: var(--color-red-100, #ffe9e5);\n  --error-text: var(--color-red-700, #b23a2a);\n  --badge-bg: var(--background-dim-transparent, rgba(0, 0, 0, 0.06));\n\n  --up: #10b981;\n  --down: #ef4444;\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nhtml,\nbody,\n#plugin-root {\n  height: 100%;\n  min-height: 100%;\n}\n\nbody {\n  background: #f0f2f5;\n  background: var(--bg);\n  color: #111827;\n  color: var(--text);\n}\n\n#plugin-root {\n  display: flex;\n  flex-direction: column;\n  min-height: 0;\n}\n\n/* \u2500\u2500 Shell \u2500\u2500 */\n.shell {\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  min-height: 120px;\n  width: 100%;\n  padding: 12px;\n  gap: 12px;\n  overflow-x: hidden;\n  overflow-y: auto;\n  scrollbar-width: thin;\n  scrollbar-color: #9ca3af transparent;\n  scrollbar-color: var(--text-faint) transparent;\n}\n\n.shell--message {\n  justify-content: flex-start;\n}\n\n.shell::-webkit-scrollbar {\n  width: 6px;\n}\n.shell::-webkit-scrollbar-thumb {\n  background: #9ca3af;\n  background: var(--text-faint);\n  border-radius: 3px;\n}\n\n.muted {\n  color: #6b7280;\n  color: var(--muted);\n  font-size: 0.9rem;\n}\n\n/* \u2500\u2500 Buttons \u2500\u2500 */\n.btn {\n  font: inherit;\n  font-weight: 600;\n  border-radius: 8px;\n  border-radius: var(--radius);\n  border: 1px solid transparent;\n  padding: 8px 16px;\n  cursor: pointer;\n  white-space: nowrap;\n}\n.btn--ghost {\n  background: transparent;\n  border-color: rgba(0, 0, 0, 0.09);\n  border-color: var(--border);\n  color: #111827;\n  color: var(--text);\n}\n.btn--ghost:hover:not(:disabled) {\n  background: rgb(232, 230, 255);\n  border-color: #5a4cff;\n  border-color: var(--primary);\n}\n@supports (color: color-mix(in lch, red, blue)) {\n.btn--ghost:hover:not(:disabled) {\n  background: color-mix(in srgb, var(--primary) 14%, var(--card));\n}\n}\n.btn--primary {\n  background: #5a4cff;\n  background: var(--primary);\n  border-color: #5a4cff;\n  border-color: var(--primary);\n  color: #fff;\n}\n.btn--primary:hover:not(:disabled) {\n  opacity: 0.88;\n}\n.btn--sm {\n  font-size: 0.8rem;\n  padding: 5px 11px;\n}\n\n.btn-spinner {\n  display: inline-block;\n  width: 10px;\n  height: 10px;\n  border: 1.5px solid rgba(255,255,255,0.4);\n  border-top-color: #fff;\n  border-radius: 50%;\n  animation: spin 0.7s linear infinite;\n  vertical-align: middle;\n  margin-right: 2px;\n}\n.btn:focus-visible {\n  outline: 2px solid #5a4cff;\n  outline: 2px solid var(--primary);\n  outline-offset: 2px;\n}\n.filter-actions {\n  display: flex;\n  gap: 6px;\n  align-items: center;\n}\n\n/* \u2500\u2500 States \u2500\u2500 */\n.state {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 32px 16px;\n  text-align: center;\n}\n.state--empty {\n  border: 1px dashed rgba(0, 0, 0, 0.09);\n  border: 1px dashed var(--border);\n  border-radius: 8px;\n  border-radius: var(--radius);\n}\n.state__title {\n  font-weight: 600;\n}\n\n.spinner {\n  width: 22px;\n  height: 22px;\n  border-radius: 50%;\n  border: 2.5px solid rgba(0, 0, 0, 0.09);\n  border: 2.5px solid var(--border);\n  border-top-color: #5a4cff;\n  border-top-color: var(--primary);\n  animation: spin 0.8s linear infinite;\n}\n\n@keyframes spin {\n  to {\n    transform: rotate(360deg);\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n  .spinner {\n    animation-duration: 0.8s !important;\n    animation-iteration-count: infinite !important;\n  }\n}\n\n/* \u2500\u2500 Banner \u2500\u2500 */\n.banner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  border-radius: 8px;\n  border-radius: var(--radius);\n  padding: 12px 14px;\n}\n.banner__title {\n  font-weight: 600;\n}\n.banner__msg {\n  font-size: 0.85rem;\n  margin-top: 2px;\n  white-space: pre-wrap;\n  word-break: break-word;\n}\n.banner--error {\n  background: #ffe9e5;\n  background: var(--error-bg);\n  color: #b23a2a;\n  color: var(--error-text);\n}\n\n/* \u2500\u2500 Tabs \u2500\u2500 */\n.tabs {\n  display: flex;\n  gap: 4px;\n  border-bottom: 1px solid rgba(0, 0, 0, 0.09);\n  border-bottom: 1px solid var(--border);\n}\n.tab {\n  font: inherit;\n  font-weight: 600;\n  font-size: 0.9rem;\n  padding: 8px 14px;\n  border: none;\n  border-bottom: 2px solid transparent;\n  background: transparent;\n  color: #6b7280;\n  color: var(--muted);\n  cursor: pointer;\n  margin-bottom: -1px;\n}\n.tab:hover {\n  color: #111827;\n  color: var(--text);\n}\n.tab--active {\n  color: #111827;\n  color: var(--text);\n  border-bottom-color: #5a4cff;\n  border-bottom-color: var(--primary);\n}\n.tab:focus-visible {\n  outline: 2px solid #5a4cff;\n  outline: 2px solid var(--primary);\n  outline-offset: 2px;\n  border-radius: 4px 4px 0 0;\n}\n\n/* \u2500\u2500 Filter bar \u2500\u2500 */\n.filter-bar {\n  display: flex;\n  gap: 16px;\n  flex-wrap: wrap;\n  align-items: flex-end;\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  border-radius: var(--radius);\n  padding: 12px 14px;\n}\n\n.filter-bar__note {\n  width: 100%;\n  margin: 2px 0 0;\n  font-size: 0.78rem;\n  color: #6b7280;\n  color: var(--muted);\n  line-height: 1.4;\n}\n\n.filter-group {\n  display: flex;\n  flex-direction: column;\n  gap: 5px;\n}\n\n.filter-label {\n  font-size: 0.72rem;\n  font-weight: 600;\n  color: #6b7280;\n  color: var(--muted);\n  text-transform: uppercase;\n  letter-spacing: 0.04em;\n}\n\n/* \u2500\u2500 Date range picker \u2500\u2500 */\n.date-picker {\n  position: relative;\n}\n.dp__trigger {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  font: inherit;\n  font-size: 0.85rem;\n  font-weight: 600;\n  color: #111827;\n  color: var(--text);\n  background: #f0f2f5;\n  background: var(--bg);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  padding: 6px 10px;\n  cursor: pointer;\n  white-space: nowrap;\n}\n.dp__trigger:hover {\n  border-color: #5a4cff;\n  border-color: var(--primary);\n}\n.dp__trigger:focus-visible {\n  outline: 2px solid #5a4cff;\n  outline: 2px solid var(--primary);\n  outline-offset: 2px;\n}\n.dp__cal-icon {\n  font-size: 0.9rem;\n  line-height: 1;\n}\n.dp__caret {\n  color: #6b7280;\n  color: var(--muted);\n  font-size: 0.7rem;\n}\n\n.dp__pop {\n  position: absolute;\n  z-index: 50;\n  top: calc(100% + 6px);\n  left: 0;\n  display: flex;\n  flex-direction: column;\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 10px;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);\n  width: min(660px, calc(100vw - 24px));\n}\n.dp__body {\n  display: flex;\n  flex-wrap: nowrap;\n}\n.dp__rail {\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  padding: 10px;\n  border-right: 1px solid rgba(0, 0, 0, 0.09);\n  border-right: 1px solid var(--border);\n  min-width: 132px;\n}\n.dp__preset {\n  font: inherit;\n  font-size: 0.82rem;\n  text-align: left;\n  padding: 6px 10px;\n  border: none;\n  border-radius: 6px;\n  background: transparent;\n  color: #111827;\n  color: var(--text);\n  cursor: pointer;\n  white-space: nowrap;\n}\n.dp__preset:hover {\n  background: rgba(0, 0, 0, 0.04);\n  background: var(--hover-bg);\n}\n.dp__preset--active {\n  color: #5a4cff;\n  color: var(--primary);\n  font-weight: 700;\n}\n\n.dp__cals {\n  position: relative;\n  padding: 10px 12px;\n  flex: 1;\n}\n.dp__cal-nav {\n  position: absolute;\n  top: 12px;\n  left: 12px;\n  right: 12px;\n  display: flex;\n  justify-content: space-between;\n  pointer-events: none;\n}\n.dp__nav-btn {\n  pointer-events: auto;\n  font: inherit;\n  font-size: 1rem;\n  line-height: 1;\n  width: 24px;\n  height: 24px;\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 6px;\n  background: #f0f2f5;\n  background: var(--bg);\n  color: #111827;\n  color: var(--text);\n  cursor: pointer;\n}\n.dp__nav-btn:hover:not(:disabled) {\n  border-color: #5a4cff;\n  border-color: var(--primary);\n}\n.dp__nav-btn:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n\n.dp__cal-grid {\n  display: flex;\n  gap: 18px;\n}\n.cal {\n  width: 208px;\n}\n.cal__month {\n  text-align: center;\n  font-size: 0.85rem;\n  font-weight: 600;\n  height: 24px;\n  line-height: 24px;\n  margin-bottom: 6px;\n}\n.cal__dow,\n.cal__grid {\n  display: grid;\n  grid-template-columns: repeat(7, 1fr);\n}\n.cal__dow {\n  margin-bottom: 4px;\n}\n.cal__dow span {\n  text-align: center;\n  font-size: 0.68rem;\n  font-weight: 600;\n  color: #6b7280;\n  color: var(--muted);\n}\n.cal__day {\n  font: inherit;\n  font-size: 0.8rem;\n  aspect-ratio: 1;\n  border: none;\n  background: transparent;\n  color: #111827;\n  color: var(--text);\n  cursor: pointer;\n  border-radius: 6px;\n}\n.cal__day:hover:not(:disabled) {\n  background: rgba(0, 0, 0, 0.04);\n  background: var(--hover-bg);\n}\n.cal__day--out {\n  color: #9ca3af;\n  color: var(--text-faint);\n}\n.cal__day--disabled {\n  opacity: 0.35;\n  cursor: default;\n}\n.cal__day--today {\n  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.09);\n  box-shadow: inset 0 0 0 1px var(--border);\n}\n.cal__day--range,\n.cal__day--preview {\n  background: rgba(17, 24, 39, 0.12);\n  border-radius: 0;\n}\n@supports (color: color-mix(in lch, red, blue)) {\n.cal__day--range,\n.cal__day--preview {\n  background: color-mix(in srgb, var(--text) 12%, transparent);\n}\n}\n.cal__day--preview {\n  opacity: 0.6;\n}\n.cal__day--start,\n.cal__day--end {\n  background: rgba(17, 24, 39, 0.82) !important;\n  color: #f0f2f5 !important;\n  color: var(--bg) !important;\n  font-weight: 700;\n}\n@supports (color: color-mix(in lch, red, blue)) {\n.cal__day--start,\n.cal__day--end {\n  background: color-mix(in srgb, var(--text) 82%, transparent) !important;\n}\n}\n.cal__day--start {\n  border-radius: 6px 0 0 6px;\n}\n.cal__day--end {\n  border-radius: 0 6px 6px 0;\n}\n.cal__day--start.cal__day--end {\n  border-radius: 6px;\n}\n\n.dp__footer {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 10px 12px;\n  border-top: 1px solid rgba(0, 0, 0, 0.09);\n  border-top: 1px solid var(--border);\n}\n.dp__summary {\n  font-size: 0.82rem;\n  color: #6b7280;\n  color: var(--muted);\n}\n.dp__actions {\n  display: flex;\n  gap: 8px;\n}\n.dp__btn {\n  font: inherit;\n  font-size: 0.82rem;\n  font-weight: 600;\n  padding: 6px 14px;\n  border-radius: 7px;\n  border: 1px solid transparent;\n  cursor: pointer;\n}\n.dp__btn--ghost {\n  background: transparent;\n  border-color: rgba(0, 0, 0, 0.09);\n  border-color: var(--border);\n  color: #111827;\n  color: var(--text);\n}\n.dp__btn--ghost:hover {\n  background: rgba(0, 0, 0, 0.04);\n  background: var(--hover-bg);\n}\n.dp__btn--primary {\n  background: #5a4cff;\n  background: var(--primary);\n  border-color: #5a4cff;\n  border-color: var(--primary);\n  color: #fff;\n}\n.dp__btn--primary:hover:not(:disabled) {\n  opacity: 0.88;\n}\n.dp__btn--primary:disabled {\n  opacity: 0.5;\n  cursor: default;\n}\n\n@media (max-width: 560px) {\n  .cal--second {\n    display: none;\n  }\n}\n\n/* \u2500\u2500 Segmented control \u2500\u2500 */\n.seg {\n  display: inline-flex;\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  overflow: hidden;\n  background: #f0f2f5;\n  background: var(--bg);\n}\n.seg__btn {\n  font: inherit;\n  font-size: 0.82rem;\n  font-weight: 600;\n  padding: 6px 12px;\n  border: none;\n  border-right: 1px solid rgba(0, 0, 0, 0.09);\n  border-right: 1px solid var(--border);\n  background: transparent;\n  color: #6b7280;\n  color: var(--muted);\n  cursor: pointer;\n  white-space: nowrap;\n}\n.seg__btn:last-child {\n  border-right: none;\n}\n.seg__btn:hover {\n  color: #111827;\n  color: var(--text);\n}\n.seg__btn--active {\n  background: #5a4cff;\n  background: var(--primary);\n  color: #fff;\n}\n.seg__btn:focus-visible {\n  outline: 2px solid #5a4cff;\n  outline: 2px solid var(--primary);\n  outline-offset: -2px;\n}\n.seg--inline .seg__btn {\n  font-size: 0.75rem;\n  padding: 4px 9px;\n}\n\n/* \u2500\u2500 Summary strip / KPI \u2500\u2500 */\n.summary-strip {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));\n  grid-gap: 8px;\n  gap: 8px;\n}\n\n.kpi {\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  border-radius: var(--radius);\n  padding: 10px 12px;\n  display: flex;\n  flex-direction: column;\n  gap: 3px;\n}\n.kpi--muted {\n  opacity: 0.72;\n}\n\n.kpi__value-row {\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n}\n.kpi__value {\n  font-size: 1.3rem;\n  font-weight: 700;\n  line-height: 1;\n}\n.kpi__suffix {\n  font-size: 0.8rem;\n  font-weight: 500;\n  color: #6b7280;\n  color: var(--muted);\n}\n.kpi__delta {\n  font-size: 0.72rem;\n  font-weight: 700;\n}\n.kpi__delta--up {\n  color: #10b981;\n  color: var(--up);\n}\n.kpi__delta--down {\n  color: #ef4444;\n  color: var(--down);\n}\n.kpi__label {\n  color: #111827;\n  color: var(--text);\n  font-size: 0.78rem;\n  font-weight: 600;\n}\n.kpi__sub {\n  font-size: 0.7rem;\n  color: #6b7280;\n  color: var(--muted);\n}\n\n/* \u2500\u2500 Section + layout \u2500\u2500 */\n.section {\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  border-radius: var(--radius);\n  padding: 13px;\n  display: flex;\n  flex-direction: column;\n  gap: 11px;\n  min-width: 0;\n}\n.section__header {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px;\n  flex-wrap: wrap;\n}\n.section__title {\n  font-size: 0.95rem;\n  font-weight: 600;\n}\n.section__title-group {\n  display: flex;\n  align-items: baseline;\n  gap: 8px;\n  flex-wrap: wrap;\n}\n.section__hint {\n  font-size: 0.8rem;\n}\n.section__inline-controls {\n  display: flex;\n  gap: 6px;\n  align-items: center;\n  flex-wrap: wrap;\n}\n\n.grid {\n  display: grid;\n  grid-gap: 12px;\n  gap: 12px;\n}\n.grid--2 {\n  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n}\n\n/* \u2500\u2500 Charts (shared by LineChart + GroupedBars) \u2500\u2500 */\n.chart {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n.chart__plot {\n  position: relative;\n}\n.chart__svg {\n  width: 100%;\n  height: auto;\n  display: block;\n}\n.chart__grid {\n  stroke: rgba(0, 0, 0, 0.09);\n  stroke: var(--border);\n  stroke-width: 1;\n}\n.chart__axis {\n  fill: #6b7280;\n  fill: var(--muted);\n  font-size: 10px;\n}\n.chart__xlabel {\n  fill: #6b7280;\n  fill: var(--muted);\n  font-size: 10px;\n}\n.chart__cursor {\n  stroke: #9ca3af;\n  stroke: var(--text-faint);\n  stroke-width: 1;\n  stroke-dasharray: 3 3;\n}\n.chart__bar-hover {\n  fill: rgba(0, 0, 0, 0.04);\n  fill: var(--hover-bg);\n}\n\n.chart__pop {\n  position: absolute;\n  top: 6px;\n  z-index: 5;\n  pointer-events: none;\n  min-width: 150px;\n  max-width: 240px;\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.24);\n  padding: 8px 10px;\n}\n.chart__pop-title {\n  font-weight: 700;\n  font-size: 0.8rem;\n  margin-bottom: 5px;\n}\n.chart__pop-row {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 0.8rem;\n}\n.chart__pop-dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  flex: none;\n}\n.chart__pop-name {\n  flex: 1;\n  color: #6b7280;\n  color: var(--muted);\n}\n.chart__pop-val {\n  font-weight: 700;\n}\n\n.chart__legend {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px 14px;\n  font-size: 0.8rem;\n  color: #6b7280;\n  color: var(--muted);\n}\n.chart__legend-item {\n  display: flex;\n  align-items: center;\n  gap: 5px;\n}\n.chart__legend-dot {\n  width: 9px;\n  height: 9px;\n  border-radius: 2px;\n  flex: none;\n}\n\n/* \u2500\u2500 Ranked breakdown \u2500\u2500 */\n.breakdown {\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n.breakdown__bars {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n.breakdown__row {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.breakdown__label {\n  flex: 0 0 120px;\n  font-size: 0.85rem;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n.breakdown__track {\n  flex: 1;\n  height: 10px;\n  border-radius: 999px;\n  background: #f7f8fa;\n  background: var(--card2);\n  overflow: hidden;\n}\n.breakdown__fill {\n  display: block;\n  height: 100%;\n  border-radius: 999px;\n  transition: width 0.3s ease;\n}\n.breakdown__val {\n  flex: 0 0 56px;\n  font-size: 0.82rem;\n  font-weight: 600;\n  text-align: right;\n}\n\n/* \u2500\u2500 Table \u2500\u2500 */\n.table {\n  display: flex;\n  flex-direction: column;\n  font-size: 0.85rem;\n}\n.table__head,\n.table__row {\n  display: grid;\n  grid-template-columns: 1.6fr repeat(4, 1fr);\n  grid-gap: 8px;\n  gap: 8px;\n  align-items: center;\n  padding: 7px 0;\n}\n.table__head {\n  border-bottom: 2px solid rgba(0, 0, 0, 0.09);\n  border-bottom: 2px solid var(--border);\n  font-size: 0.72rem;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.03em;\n  color: #6b7280;\n  color: var(--muted);\n}\n.table__row {\n  border-bottom: 1px solid rgba(0, 0, 0, 0.09);\n  border-bottom: 1px solid var(--border);\n}\n.table__row:last-child {\n  border-bottom: none;\n}\n.table__row:hover {\n  background: rgba(0, 0, 0, 0.04);\n  background: var(--hover-bg);\n}\n.table__cell {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n.table__cell--name {\n  font-weight: 500;\n}\n.table__cell--num {\n  text-align: right;\n  font-feature-settings: "tnum";\n  font-variant-numeric: tabular-nums;\n}\n\n/* \u2500\u2500 Phase distribution \u2500\u2500 */\n.phase-list {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n.phase-row {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.phase-row__name {\n  flex: 0 0 130px;\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n.phase-row__dot {\n  width: 9px;\n  height: 9px;\n  border-radius: 50%;\n  flex: none;\n}\n.phase-row__track {\n  flex: 1;\n  height: 10px;\n  border-radius: 999px;\n  background: #f7f8fa;\n  background: var(--card2);\n  overflow: hidden;\n}\n.phase-row__fill {\n  display: block;\n  height: 100%;\n  border-radius: 999px;\n  transition: width 0.3s ease;\n}\n.phase-row__val {\n  flex: 0 0 70px;\n  display: flex;\n  align-items: baseline;\n  justify-content: flex-end;\n  gap: 6px;\n  font-size: 0.85rem;\n  font-weight: 700;\n}\n/* \u2500\u2500 Comparison (previous period) \u2500\u2500 */\n.delta--up {\n  color: #10b981;\n  color: var(--up);\n}\n.delta--down {\n  color: #ef4444;\n  color: var(--down);\n}\n\n.chart__pop-delta {\n  font-size: 0.72rem;\n  font-weight: 700;\n}\n\n.chart__legend-item--muted {\n  color: #9ca3af;\n  color: var(--text-faint);\n}\n.chart__legend-dash {\n  display: inline-block;\n  width: 16px;\n  height: 0;\n  border-top: 2px dashed currentColor;\n}\n.chart__legend-ghost {\n  display: inline-block;\n  width: 10px;\n  height: 10px;\n  border-radius: 2px;\n  background: #9ca3af;\n  background: var(--text-faint);\n  opacity: 0.4;\n}\n\n/* Breakdown table gains a \u0394 column when comparing. */\n.table--compare .table__head,\n.table--compare .table__row {\n  grid-template-columns: 1.6fr repeat(5, 1fr);\n}\n\n/* \u2500\u2500 Insights tab \u2500\u2500 */\n.insights {\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.insights__header {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n  padding-bottom: 10px;\n  border-bottom: 1px solid rgba(0, 0, 0, 0.09);\n  border-bottom: 1px solid var(--border);\n  margin-bottom: 10px;\n}\n\n.insights__header--open {\n  border-bottom: none;\n  margin-bottom: 0;\n  padding-bottom: 8px;\n}\n\n.insights__icon {\n  font-size: 1rem;\n  color: #5a4cff;\n  color: var(--primary);\n  line-height: 1;\n}\n\n.insights__heading {\n  font-size: 1rem;\n  font-weight: 700;\n  margin-right: 4px;\n}\n\n.insights__header a {\n  -webkit-text-decoration: none;\n  text-decoration: none;\n}\n\n.insights__period-bar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin-top: -4px;\n}\n\n.insights__period-label {\n  font-size: 0.75rem;\n  font-weight: 600;\n  color: #6b7280;\n  color: var(--muted);\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n  white-space: nowrap;\n}\n\n.insights__period-value {\n  font-size: 0.82rem;\n  font-weight: 500;\n  color: #111827;\n  color: var(--text);\n}\n\n.insights__period-hint {\n  font-size: 0.75rem;\n}\n\n.insights__period-select {\n  font: inherit;\n  font-size: 0.82rem;\n  font-weight: 500;\n  color: #111827;\n  color: var(--text);\n  background: #f0f2f5;\n  background: var(--bg);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 7px;\n  padding: 4px 8px;\n  cursor: pointer;\n}\n\n.insights__period-select:focus-visible {\n  outline: 2px solid #5a4cff;\n  outline: 2px solid var(--primary);\n  outline-offset: 2px;\n}\n\n.insights__meta {\n  font-size: 0.79rem;\n  margin-top: -4px;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  flex-wrap: wrap;\n}\n\n.insights__meta-sep {\n  color: #9ca3af;\n  color: var(--text-faint);\n}\n\n.insights__meta-link {\n  color: #5a4cff;\n  color: var(--primary);\n  -webkit-text-decoration: none;\n  text-decoration: none;\n  font-size: 0.79rem;\n}\n\n.insights__meta-link:hover {\n  -webkit-text-decoration: underline;\n  text-decoration: underline;\n}\n\n\n.insights__generating {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 8px 12px;\n  border-radius: 8px;\n  border-radius: var(--radius);\n  background: rgba(90, 76, 255, 0.08);\n  border: 1px solid rgba(90, 76, 255, 0.2);\n  font-size: 0.82rem;\n}\n\n\n@supports (color: color-mix(in lch, red, blue)) {\n.insights__generating {\n  background: color-mix(in srgb, var(--primary) 8%, transparent);\n  border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);\n}\n}\n\n.insights__generating-spinner {\n  width: 14px;\n  height: 14px;\n  border: 2px solid rgba(90, 76, 255, 0.3);\n  border-top-color: #5a4cff;\n  border-top-color: var(--primary);\n  border-radius: 50%;\n  flex: none;\n  animation: spin 0.8s linear infinite;\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.insights__generating-spinner {\n  border: 2px solid color-mix(in srgb, var(--primary) 30%, transparent);\n}\n}\n\n.insights__generating-text {\n  flex: 1;\n  color: #111827;\n  color: var(--text);\n}\n\n.insights__error {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  padding: 10px 14px;\n  border-radius: 8px;\n  border-radius: var(--radius);\n  background: #ffe9e5;\n  background: var(--error-bg);\n  color: #b23a2a;\n  color: var(--error-text);\n  font-size: 0.82rem;\n}\n\n.insights__error strong { font-weight: 600; }\n\n.insights__content {\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n/* \u2500\u2500 Summary card \u2500\u2500 */\n.insight-summary {\n  background: rgb(245, 244, 255);\n  border: 1px solid rgba(66, 56, 187, 0.272);\n  border-radius: 8px;\n  border-radius: var(--radius);\n  padding: 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n@supports (color: color-mix(in lch, red, blue)) {\n.insight-summary {\n  background: color-mix(in srgb, var(--primary) 6%, var(--card));\n  border: 1px solid color-mix(in srgb, var(--primary) 20%, var(--border));\n}\n}\n\n.insight-summary__label {\n  font-size: 0.68rem;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.07em;\n  color: #5a4cff;\n  color: var(--primary);\n}\n\n.insight-summary__body {\n  font-size: 0.88rem;\n  line-height: 1.65;\n  color: #111827;\n  color: var(--text);\n}\n\n.insight-summary__note {\n  font-size: 0.77rem;\n  color: #6b7280;\n  color: var(--muted);\n  font-style: italic;\n  padding-top: 4px;\n  border-top: 1px solid rgba(0, 0, 0, 0.054);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.insight-summary__note {\n  border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);\n}\n}\n\n/* \u2500\u2500 Individual cards \u2500\u2500 */\n.insight-card {\n  background: #ffffff;\n  background: var(--card);\n  border: 1px solid rgba(0, 0, 0, 0.09);\n  border: 1px solid var(--border);\n  border-radius: 8px;\n  border-radius: var(--radius);\n  overflow: hidden;\n}\n\n.insight-card__header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n  padding: 12px 14px 10px;\n  border-bottom: 1px solid rgba(0, 0, 0, 0.09);\n  border-bottom: 1px solid var(--border);\n}\n\n.insight-card__count {\n  font-size: 0.75rem;\n  font-weight: 600;\n  color: #6b7280;\n  color: var(--muted);\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  padding: 2px 8px;\n  border-radius: 999px;\n}\n\n.insight-card--risks {\n  border-color: rgba(202, 131, 9, 0.363);\n  background: rgb(255, 251, 245);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.insight-card--risks {\n  border-color: color-mix(in srgb, #f59e0b 30%, var(--border));\n  background: color-mix(in srgb, #f59e0b 4%, var(--card));\n}\n}\n\n.insight-card--risks .insight-card__header {\n  border-bottom-color: rgba(202, 131, 9, 0.363);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.insight-card--risks .insight-card__header {\n  border-bottom-color: color-mix(in srgb, #f59e0b 30%, var(--border));\n}\n}\n\n.insight-card__title {\n  font-size: 0.72rem;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  color: #6b7280;\n  color: var(--muted);\n}\n\n.insight-card--risks .insight-card__title {\n  color: #b45309;\n}\n\n.insight-card__list {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  padding: 12px 14px;\n}\n\n.insight-card__item {\n  display: flex;\n  align-items: flex-start;\n  gap: 8px;\n  font-size: 0.85rem;\n  line-height: 1.5;\n}\n\n.insight-card__item-icon {\n  flex: none;\n  width: 16px;\n  text-align: center;\n  font-size: 0.7rem;\n  margin-top: 3px;\n  color: #6b7280;\n  color: var(--muted);\n}\n\n.insight-card__item--risk .insight-card__item-icon {\n  color: #b45309;\n  font-weight: 700;\n}\n\n/* Empty / setup states */\n.insights__empty-icon {\n  font-size: 2rem;\n  color: #5a4cff;\n  color: var(--primary);\n  opacity: 0.5;\n  line-height: 1;\n}\n\n.insights__empty,\n.insights__setup {\n  gap: 12px;\n}\n\n/* \u2500\u2500 Badges \u2500\u2500 */\n.badge {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 2px 8px;\n  border-radius: 999px;\n  font-size: 0.69rem;\n  font-weight: 700;\n  white-space: nowrap;\n  line-height: 1.4;\n}\n\n.badge--neutral {\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  color: #6b7280;\n  color: var(--muted);\n}\n\n.badge--category {\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  color: #111827;\n  color: var(--text);\n  font-weight: 600;\n}\n\n.badge--sev-high {\n  background: rgba(239, 68, 68, 0.14);\n  color: #dc2626;\n}\n\n.badge--sev-medium {\n  background: rgba(245, 158, 11, 0.14);\n  color: #b45309;\n}\n\n.badge--sev-low {\n  background: rgba(16, 185, 129, 0.14);\n  color: #059669;\n}\n\n.badge--conf-high {\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  color: #5a4cff;\n  color: var(--primary);\n  box-shadow: inset 0 0 0 1px #5a4cff;\n  box-shadow: inset 0 0 0 1px var(--primary);\n}\n\n.badge--conf-medium {\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  color: #6b7280;\n  color: var(--muted);\n}\n\n.badge--conf-low {\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  color: #9ca3af;\n  color: var(--text-faint);\n}\n\n.badge--run-success {\n  background: rgba(16, 185, 129, 0.14);\n  color: #059669;\n}\n\n.badge--run-failure {\n  background: rgba(239, 68, 68, 0.14);\n  color: #dc2626;\n}\n\n.badge--run-cancelled {\n  background: rgba(0, 0, 0, 0.06);\n  background: var(--badge-bg);\n  color: #6b7280;\n  color: var(--muted);\n}\n\n.badge--run-active {\n  background: rgba(90, 76, 255, 0.14);\n  color: #5a4cff;\n  color: var(--primary);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.badge--run-active {\n  background: color-mix(in srgb, var(--primary) 14%, transparent);\n}\n}\n\n/* \u2500\u2500 Findings table \u2500\u2500 */\n.findings-wrap {\n  overflow-x: auto;\n  scrollbar-width: thin;\n  scrollbar-color: #9ca3af transparent;\n  scrollbar-color: var(--text-faint) transparent;\n}\n\n.findings-wrap::-webkit-scrollbar {\n  height: 5px;\n}\n\n.findings-wrap::-webkit-scrollbar-thumb {\n  background: #9ca3af;\n  background: var(--text-faint);\n  border-radius: 3px;\n}\n\n.findings-table {\n  width: 100%;\n  min-width: 760px;\n  border-collapse: collapse;\n  font-size: 0.81rem;\n}\n\n.findings-table thead {\n  position: sticky;\n  top: 0;\n  z-index: 1;\n  background: #f7f8fa;\n  background: var(--card2);\n}\n\n.findings-table th {\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  font-size: 0.67rem;\n  font-weight: 700;\n  color: #6b7280;\n  color: var(--muted);\n  padding: 9px 12px;\n  border-bottom: 1px solid rgba(0, 0, 0, 0.09);\n  border-bottom: 1px solid var(--border);\n  text-align: left;\n  white-space: nowrap;\n}\n\n.findings-table th.ft-sortable {\n  cursor: pointer;\n  -webkit-user-select: none;\n     -moz-user-select: none;\n          user-select: none;\n}\n\n.findings-table th.ft-sortable:hover {\n  color: #111827;\n  color: var(--text);\n}\n\n.findings-table th.ft-sorted {\n  color: #5a4cff;\n  color: var(--primary);\n}\n\n.ft-sort-icon {\n  display: inline-block;\n  margin-left: 4px;\n  font-size: 0.65rem;\n  opacity: 0.4;\n  vertical-align: middle;\n}\n\n.ft-sort-icon--active {\n  opacity: 1;\n  color: #5a4cff;\n  color: var(--primary);\n}\n\n.findings-table td {\n  padding: 11px 12px;\n  border-bottom: 1px solid rgba(0, 0, 0, 0.05);\n  vertical-align: top;\n  line-height: 1.45;\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.findings-table td {\n  border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);\n}\n}\n\n.findings-table tbody tr:last-child td {\n  border-bottom: none;\n}\n\n.findings-table tbody tr:hover td {\n  background: rgb(250, 250, 255);\n}\n\n@supports (color: color-mix(in lch, red, blue)) {\n.findings-table tbody tr:hover td {\n  background: color-mix(in srgb, var(--primary) 3%, var(--card
