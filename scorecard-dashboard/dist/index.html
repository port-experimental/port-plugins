     var(--border-medium,               #e2e8f0);\n  --sc-border-strong: var(--border-contrast-medium,      #c8d3e2);\n  --sc-text:          var(--text-high,                   #111827);\n  --sc-text-muted:    var(--text-medium,                 #6b7280);\n  --sc-text-faint:    var(--text-low,                    #9ca3af);\n  --sc-row-hover:     var(--background-dim-transparent,  rgba(0,0,0,0.025));\n  --sc-accent:        #3c73f3;\n  --sc-grade-a-text:  #15803d;\n  --sc-grade-a-bg:    rgba(21, 128, 61, 0.10);\n  --sc-grade-b-text:  #d97706;\n  --sc-grade-b-bg:    rgba(217, 119, 6, 0.10);\n  --sc-grade-c-text:  #ea580c;\n  --sc-grade-c-bg:    rgba(234, 88, 12, 0.10);\n  --sc-grade-f-text:  #b91c1c;\n  --sc-grade-f-bg:    rgba(185, 28, 28, 0.10);\n  --sc-grade-na-text: var(--text-low, #9ca3af);\n  --sc-grade-na-bg:   rgba(0, 0, 0, 0.06);\n}\n\n/* Dark-mode fallback: if Port injects dark CSS vars, these are already handled.\n   This covers the case where theme.mode=dark but vars aren't injected. */\n.sc-dashboard[data-theme="dark"] {\n  --sc-bg:            #0f111a;\n  --sc-surface:       #151d2e;\n  --sc-border:        #1e2a3f;\n  --sc-border-strong: #2c3d5a;\n  --sc-text:          #e8edf5;\n  --sc-text-muted:    #7a93b8;\n  --sc-text-faint:    #4e6280;\n  --sc-row-hover:     rgba(255, 255, 255, 0.04);\n  --sc-grade-a-text:  #4ade80;\n  --sc-grade-a-bg:    rgba(74, 222, 128, 0.12);\n  --sc-grade-b-text:  #fbbf24;\n  --sc-grade-b-bg:    rgba(251, 191, 36, 0.12);\n  --sc-grade-c-text:  #fb923c;\n  --sc-grade-c-bg:    rgba(251, 146, 60, 0.12);\n  --sc-grade-f-text:  #f87171;\n  --sc-grade-f-bg:    rgba(248, 113, 113, 0.12);\n  --sc-grade-na-text: #4e6280;\n  --sc-grade-na-bg:   rgba(255, 255, 255, 0.06);\n}\n\n/* \u2500\u2500 Shell \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-dashboard {\n  display: flex;\n  flex-direction: column;\n  min-height: 100%;\n  background: var(--sc-bg);\n  color: var(--sc-text);\n  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  font-size: 14px;\n  box-sizing: border-box;\n}\n\n/* \u2500\u2500 Header \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-header {\n  padding: 14px 20px 12px;\n  border-bottom: 1px solid var(--sc-border);\n  background: var(--sc-bg);\n  flex-shrink: 0;\n}\n.sc-header__title {\n  font-size: 15px;\n  font-weight: 700;\n  color: var(--sc-text);\n  line-height: 1.3;\n}\n.sc-header__subtitle {\n  font-size: 12px;\n  color: var(--sc-text-muted);\n  margin-top: 3px;\n}\n.sc-header__subtitle strong {\n  color: var(--sc-text);\n  font-weight: 600;\n}\n\n/* \u2500\u2500 Grade legend \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-legend {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 7px 20px;\n  background: var(--sc-bg);\n  border-bottom: 1px solid var(--sc-border);\n  flex-shrink: 0;\n  flex-wrap: wrap;\n}\n.sc-legend__label {\n  font-size: 11px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.04em;\n  color: var(--sc-text-muted);\n}\n.sc-legend__item {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-size: 11px;\n  color: var(--sc-text-muted);\n}\n.sc-legend__dot {\n  width: 7px;\n  height: 7px;\n  border-radius: 50%;\n  flex-shrink: 0;\n}\n.sc-legend__dot--a { background: var(--sc-grade-a-text); }\n.sc-legend__dot--b { background: var(--sc-grade-b-text); }\n.sc-legend__dot--c { background: var(--sc-grade-c-text); }\n.sc-legend__dot--f { background: var(--sc-grade-f-text); }\n\n/* \u2500\u2500 KPI row \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-kpi-row {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  grid-gap: 12px;\n  gap: 12px;\n  padding: 16px 20px;\n  flex-shrink: 0;\n}\n.sc-kpi-card {\n  background: var(--sc-surface);\n  border: 1px solid var(--sc-border);\n  border-radius: 8px;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 5px;\n}\n.sc-kpi-card__value {\n  font-size: 30px;\n  font-weight: 700;\n  line-height: 1;\n  color: var(--sc-text);\n  font-feature-settings: "tnum";\n  font-variant-numeric: tabular-nums;\n}\n.sc-kpi-card__value--a { color: var(--sc-grade-a-text); }\n.sc-kpi-card__value--b { color: var(--sc-grade-b-text); }\n.sc-kpi-card__value--c { color: var(--sc-grade-c-text); }\n.sc-kpi-card__value--f { color: var(--sc-grade-f-text); }\n.sc-kpi-card__label {\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--sc-text-muted);\n}\n\n/* \u2500\u2500 Scorecard cards grid \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-scorecards-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));\n  grid-gap: 12px;\n  gap: 12px;\n  padding: 0 20px 16px;\n}\n.sc-scorecard-card {\n  background: var(--sc-surface);\n  border: 1px solid var(--sc-border);\n  border-radius: 8px;\n  padding: 16px 12px 14px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 5px;\n  transition: border-color 0.15s;\n}\n.sc-scorecard-card:hover {\n  border-color: var(--sc-border-strong);\n}\n.sc-scorecard-card__title {\n  font-size: 12px;\n  font-weight: 600;\n  color: var(--sc-text);\n  text-align: center;\n  line-height: 1.3;\n}\n.sc-scorecard-card__ring {\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin: 6px 0 2px;\n}\n.sc-scorecard-card__pct {\n  position: absolute;\n  font-size: 12px;\n  font-weight: 700;\n  color: var(--sc-text);\n  font-feature-settings: "tnum";\n  font-variant-numeric: tabular-nums;\n  pointer-events: none;\n}\n.sc-scorecard-card__grade {\n  font-size: 18px;\n  font-weight: 800;\n  line-height: 1;\n}\n.sc-scorecard-card__count {\n  font-size: 11px;\n  color: var(--sc-text-muted);\n  margin-top: 2px;\n}\n.sc-scorecard-card__pass-fail {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 11px;\n}\n.sc-scorecard-card__passing { color: var(--sc-grade-a-text); }\n.sc-scorecard-card__failing { color: var(--sc-grade-f-text); }\n\n/* \u2500\u2500 Grade badge \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-badge {\n  display: inline-flex;\n  align-items: center;\n  padding: 2px 8px;\n  border-radius: 4px;\n  font-size: 12px;\n  font-weight: 600;\n  white-space: nowrap;\n  font-feature-settings: "tnum";\n  font-variant-numeric: tabular-nums;\n}\n.sc-badge--a  { background: var(--sc-grade-a-bg);  color: var(--sc-grade-a-text); }\n.sc-badge--b  { background: var(--sc-grade-b-bg);  color: var(--sc-grade-b-text); }\n.sc-badge--c  { background: var(--sc-grade-c-bg);  color: var(--sc-grade-c-text); }\n.sc-badge--f  { background: var(--sc-grade-f-bg);  color: var(--sc-grade-f-text); }\n.sc-badge--na { background: var(--sc-grade-na-bg); color: var(--sc-grade-na-text); font-weight: 500; }\n\n/* \u2500\u2500 Table section \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-table-section {\n  margin: 0 20px 24px;\n  border: 1px solid var(--sc-border);\n  border-radius: 8px;\n  overflow: hidden;\n  background: var(--sc-surface);\n}\n\n.sc-table-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  flex-wrap: wrap;\n  gap: 10px;\n  padding: 11px 16px;\n  border-bottom: 1px solid var(--sc-border);\n  background: var(--sc-bg);\n}\n.sc-table-header__title {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--sc-text);\n}\n.sc-table-header__filters {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.sc-filter__label {\n  font-size: 12px;\n  color: var(--sc-text-muted);\n}\n.sc-filter__select {\n  background: var(--sc-surface);\n  color: var(--sc-text);\n  border: 1px solid var(--sc-border-strong);\n  border-radius: 6px;\n  padding: 5px 28px 5px 10px;\n  font-size: 12px;\n  cursor: pointer;\n  -webkit-appearance: none;\n     -moz-appearance: none;\n          appearance: none;\n  background-image: url(${d});\n  background-repeat: no-repeat;\n  background-position: right 8px center;\n  font-family: inherit;\n  transition: border-color 0.15s;\n}\n.sc-filter__select:focus {\n  outline: none;\n  border-color: var(--sc-accent);\n  box-shadow: 0 0 0 2px rgba(60, 115, 243, 0.15);\n}\n\n/* \u2500\u2500 Compliance table \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.sc-compliance-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 13px;\n  background: var(--sc-surface);\n}\n.sc-compliance-table thead tr {\n  border-bottom: 1px solid var(--sc-border);\n  background: var(--sc-bg);\n  position: sticky;\n  top: 0;\n  z-index: 5;\n}\n.sc-compliance-table th {\n  padding: 8px 14px;\n  text-align: left;\n  font-size: 11px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n  color: var(--sc-text-muted);\n  white-space: nowrap;\n  cursor: pointer;\n  -webkit-user-select: none;\n     -moz-user-select: none;\n          user-select: none;\n  transition: color 0.12s;\n}\n.sc-compliance-table th:hover { color: var(--sc-text); }\n.sc-compliance-table th .sc-th__icon {\n  display: inline-block;\n  margin-right: 4px;\n  opacity: 0.5;\n  font-style: normal;\n  font-size: 10px;\n}\n.sc-compliance-table th.sc-th--sorted .sc-th__icon { opacity: 1; color: var(--sc-accent); }\n.sc-compliance-table th.sc-th--num { text-align: right; }\n\n.sc-compliance-table tbody tr {\n  border-bottom: 1px solid var(--sc-border);\n  transition: background 0.1s;\n}\n.sc-compliance-table tbody tr:last-child { border-bottom: none; }\n.sc-compliance-table tbody tr:hover { background: var(--sc-row-hover); }\n\n.sc-compliance-table td {\n  padding: 10px 14px;\n  vertical-align: middle;\n  color: var(--sc-text);\n}\n.sc-compliance-table td.sc-td--num {\n  text-align: right;\n  font-feature-settings: "tnum";\n  font-variant-numeric: tabular-nums;\n  font-weight: 600;\n  color: var(--sc-accent);\n}\n.sc-compliance-table .sc-td__leader {\n  font-weight: 600;\n  font-size: 13px;\n  cursor: pointer;\n  -webkit-user-select: none;\n     -moz-user-select: none;\n          user-select: none;\n  white-space: nowrap;\n}\n.sc-td--clickable {\n  cursor: pointer;\n  -webkit-user-select: none;\n     -moz-user-select: none;\n          user-s
